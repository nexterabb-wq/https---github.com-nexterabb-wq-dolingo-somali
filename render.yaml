services:
  - type: web
    name: duolingo-somali
    runtime: node
    plan: free
    buildCommand: npx prisma generate && npx prisma db push --skip-generate && npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: duolingo-somali-db
          property: internalDatabaseUrl
